plugins {
    id 'dev.architectury.loom-no-remap' version "${loom_version}"
    id 'java-library'
    id 'maven-publish'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_artifact_id}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

// Cada integracion es un source set propio (src/integration/<nombre>) que depende de otro mod. Se activan con
// enable_<nombre>_integration en gradle.properties; las que dependen de otra integracion exigen que esa tambien este activa.
def allIntegrationSourceSets = [
        farmersdelight      : [],
        brewinandchewin     : ["farmersdelight"],
        mynethersdelight    : ["farmersdelight"],
        endsdelight         : ["farmersdelight"],
        twilightdelight     : ["farmersdelight"],
        trailandtalesdelight: ["farmersdelight"],
        extradelight        : ["farmersdelight"],
        minersdelight       : ["farmersdelight"],
        dungeonsdelight     : ["farmersdelight"],
        culturaldelights    : ["farmersdelight"],
        rusticdelight       : ["farmersdelight"],
        festivedelight      : ["farmersdelight"],
        hearthandharvest    : ["farmersdelight"]
]

def isIntegrationRequested = { name ->
    providers.gradleProperty("enable_${name}_integration")
            .map { it.toBoolean() }
            .orElse(false)
            .get()
}

def requestedIntegrationSourceSets = allIntegrationSourceSets.keySet().findAll { name ->
    isIntegrationRequested(name)
}

def enabledIntegrationSourceSets = requestedIntegrationSourceSets.findAll { name ->
    allIntegrationSourceSets[name].every { dependencyName ->
        requestedIntegrationSourceSets.contains(dependencyName)
    }
}

def hasIntegration = { name ->
    enabledIntegrationSourceSets.contains(name)
}

// Pendiente de portar a Fabric (F1c/F2): se quedan en su sitio, fuera de la compilacion, y se van quitando de esta lista
// a medida que se portan. Ver LEEME.md de la carpeta del port.
def notPortedYet = [
        'plus/dragons/createcentralkitchen/common/gametest/**',       // GameTests de NeoForge
        'plus/dragons/createcentralkitchen/mixin/UniversalConditionalMixinPlugin.java', // sustituido por ModLoadedMixinPlugin
        // Integracion de Farmer's Delight
        'plus/dragons/createcentralkitchen/integration/farmersdelight/FarmersDelightRecipeGameTests.java' // GameTests de NeoForge
]

sourceSets {
    main {
        java.exclude notPortedYet
        resources.srcDir 'src/generated/resources'
    }
    enabledIntegrationSourceSets.each { name ->
        create(name) {
            java {
                srcDir "src/integration/${name}/java"
                exclude notPortedYet
            }
            resources {
                srcDir "src/integration/${name}/resources"
            }
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            allIntegrationSourceSets[name].each { dependencyName ->
                compileClasspath += sourceSets[dependencyName].output + sourceSets[dependencyName].compileClasspath
            }
        }
    }
    main {
        enabledIntegrationSourceSets.each { name ->
            runtimeClasspath += sourceSets[name].output
        }
    }
    // Pruebas de servidor (`gradlew runGametest`): viven aparte para que no entren en el jar.
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
        enabledIntegrationSourceSets.each { name ->
            compileClasspath += sourceSets[name].output
            runtimeClasspath += sourceSets[name].output
        }
    }
}

tasks.named("classes") {
    enabledIntegrationSourceSets.each { name ->
        finalizedBy(tasks.named("${name}Classes"))
    }
}

tasks.named("jar", Jar) {
    enabledIntegrationSourceSets.each { name ->
        from sourceSets[name].output
    }
}

tasks.named("sourcesJar", Jar) {
    enabledIntegrationSourceSets.each { name ->
        from sourceSets[name].allJava
    }
}

loom {
    runs {
        client {
            client()
            name 'Create: Central Kitchen Client'
        }
        server {
            server()
            name 'Create: Central Kitchen Server'
            programArg '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            enabledIntegrationSourceSets.each { name ->
                sourceSet sourceSets[name]
            }
        }
        "${mod_id}_gametest" {
            sourceSet sourceSets.gametest
        }
    }

    // `gradlew runGametest`: servidor sin ventana que ejecuta todos los @GameTest de src/gametest y sale;
    // resultados en build/gametest/report.xml.
    runs {
        gametest {
            server()
            name 'Game Test'
            source sourceSets.gametest
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${project.file('build/gametest/report.xml')}"
            runDir 'build/gametest'
        }
        // `gradlew runClientGameTest`: abre Minecraft REAL (con ventana), crea un mundo, juega solo y saca capturas a
        // build/run/clientGameTest/screenshots. Es lo mismo que hace `fabricApi.configureTests` en el Loom oficial, que
        // este Loom (Architectury) no tiene. NO lanzar con Gravis jugando: usar herramientas\probar-cliente.ps1.
        clientGameTest {
            client()
            name 'Client Game Test'
            source sourceSets.gametest
            vmArg '-Dfabric.client.gametest'
            vmArg '-Xmx2G'
            runDir 'build/run/clientGameTest'
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    // Rama local p3 del port de Dragons Plus. Se regenera con herramientas\publicar-dragons-plus-local.ps1.
    exclusiveContent {
        forRepository {
            maven {
                name = 'LocalPorts'
                url = uri("${rootProject.projectDir}/../local-maven")
            }
        }
        filter {
            includeGroup 'plus.dragons.createdragonsplus'
        }
    }
}

dependencies {
    // Sin `mappings`: desde 1.21.11 el juego viene sin ofuscar y el namespace de produccion ya es mojmap.
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${loader_version}"

    // El artefacto fabric-api es un contenedor sin clases propias: los modulos van nombrados uno por uno.
    api fabricApi.module("fabric-api-base", fabric_api_version)
    api fabricApi.module("fabric-lifecycle-events-v1", fabric_api_version)
    api fabricApi.module("fabric-resource-loader-v1", fabric_api_version)
    api fabricApi.module("fabric-resource-conditions-api-v1", fabric_api_version)
    api fabricApi.module("fabric-transfer-api-v1", fabric_api_version)
    api fabricApi.module("fabric-api-lookup-api-v1", fabric_api_version)
    api fabricApi.module("fabric-object-builder-api-v1", fabric_api_version)
    api fabricApi.module("fabric-rendering-v1", fabric_api_version)
    api fabricApi.module("fabric-networking-api-v1", fabric_api_version)
    api fabricApi.module("fabric-data-generation-api-v1", fabric_api_version)
    runtimeOnly "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Create Fly embebe Flywheel, Ponder y Catnip, por eso no van por separado.
    api("maven.modrinth:create-fly:${create_fly_version}") { transitive = false }
    api("plus.dragons.createdragonsplus:${create_dragons_plus_artifact}:${create_dragons_plus_version}") { transitive = false }

    // Solo anotaciones (util.FieldsNullabilityUnknownByDefault de Dragons Plus usa TypeQualifierDefault); no se empaqueta.
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    compileOnly "maven.modrinth:jei:${jei_version}"
    runtimeOnly "maven.modrinth:jei:${jei_version}"

    if (hasIntegration("farmersdelight")) {
        farmersdelightCompileOnly("maven.modrinth:farmers-delight-refabricated:${farmers_delight_version}") { transitive = false }
        // Los block entities de FD implementan ExtendedMenuProvider (fabric-menu-api); sin el modulo javac no puede leer las clases de FD.
        farmersdelightCompileOnly fabricApi.module("fabric-menu-api-v1", fabric_api_version)
        // Las pruebas de servidor miran los bloques y recetas reales de FD.
        gametestCompileOnly("maven.modrinth:farmers-delight-refabricated:${farmers_delight_version}") { transitive = false }
        gametestCompileOnly fabricApi.module("fabric-menu-api-v1", fabric_api_version)
        runtimeOnly("maven.modrinth:farmers-delight-refabricated:${farmers_delight_version}") { transitive = false }
    }

    // No forma parte del bundle fabric-api: es un modulo solo de desarrollo.
    gametestImplementation fabricApi.module("fabric-gametest-api-v1", fabric_api_version)
    // Prueba de cliente con capturas (runClientGameTest). Tambien solo de desarrollo.
    gametestImplementation fabricApi.module("fabric-client-gametest-api-v1", fabric_api_version)

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'loader_version', loader_version
    inputs.property 'create_version_range', create_version_range
    inputs.property 'create_dragons_plus_version_range', create_dragons_plus_version_range
    inputs.property 'minecraft_version_range', minecraft_version_range
    inputs.property 'jei_version', jei_version

    // Configuraciones de mixins de las integraciones activas que las tengan.
    def integrationMixinEntries = enabledIntegrationSourceSets
            .findAll { file("src/integration/${it}/resources/create_central_kitchen.${it}.mixins.json").exists() }
            .collect { ', "create_central_kitchen.' + it + '.mixins.json"' }
            .join('')
    inputs.property 'integration_mixin_entries', integrationMixinEntries

    filesMatching('fabric.mod.json') {
        expand(
                integration_mixin_entries: integrationMixinEntries,
                version: project.version,
                loader_version: loader_version,
                fabric_api_version: fabric_api_version,
                create_version_range: create_version_range,
                create_dragons_plus_version_range: create_dragons_plus_version_range,
                minecraft_version_range: minecraft_version_range,
                jei_version: jei_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.named('jar', Jar).configure {
    from 'LICENSE.txt'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = "${mod_artifact_id}-${minecraft_version}"
            from components.java
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
