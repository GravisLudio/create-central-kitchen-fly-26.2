# Gradle
org.gradle.jvmargs = -Xmx3G
org.gradle.daemon = false
org.gradle.parallel = true
org.gradle.caching = true
org.gradle.configuration-cache = false

# Fabric / Minecraft. 26.2 FINAL: Farmer's Delight Refabricated exige 26.2 (no rc) y Loader >= 0.19.5, asi que las pruebas
# con FD no arrancan en rc-2. Los otros ports (Dragons Plus, Connected) siguen en rc-2; el jar sirve igual en 26.2 final.
minecraft_version = 26.2
minecraft_version_range = >=26.2- <26.3-
loader_version = 0.19.5
loom_version = 1.17.491
# JEI 30.16 exige >=0.155.0+26.2.
fabric_api_version = 0.156.0+26.2

# Mod
# Basado en Create: Central Kitchen 2.6.2b (NeoForge 1.21.1). Se numera como el port de Dragons Plus: <base>-p<n>.
mod_id = create_central_kitchen
mod_artifact_id = create-central-kitchen-fly
mod_name = Create: Central Kitchen
mod_license = LGPL-3.0-or-later
mod_version = 2.6.2-p1
mod_group_id = plus.dragons.createcentralkitchen
mod_authors = DragonsPlus
mod_description = Integrated cooking automation for Create
mod_github = https://github.com/DragonsPlusMinecraft/CreateCentralKitchen
mod_logo = icon.png

# Integration switches. v1 = nucleo + Farmer's Delight; las demas dependen de mods que aun no existen en Fabric 26.x
# (o no se han buscado a fondo). Cada una es un source set independiente en src/integration/<nombre>.
enable_farmersdelight_integration = true
enable_brewinandchewin_integration = false
enable_mynethersdelight_integration = false
enable_endsdelight_integration = false
enable_twilightdelight_integration = false
enable_trailandtalesdelight_integration = false
enable_extradelight_integration = false
enable_minersdelight_integration = false
enable_dungeonsdelight_integration = false
enable_culturaldelights_integration = false
enable_rusticdelight_integration = false
enable_festivedelight_integration = false
enable_hearthandharvest_integration = false

# Required dependencies
create_fly_version = 26.2-6.0.9-2
create_version_range = >=6.0.9-1 <6.1.0
# Desde el 2026-10-19 Central Kitchen NO depende de Dragons Plus: RecipeConverter se copio al mod (common/recipe).

# Optional / integrations
farmers_delight_version = 26.2-3.6.28
jei_version = 30.16.0.132

# Tests
junit_version = 5.12.2
